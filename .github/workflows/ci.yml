name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: JS (lint, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci

  engine-core:
    name: Kotlin engine core (JVM unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p intent-core test --console=plain
        working-directory: android

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # One ABI keeps CI fast; the native C++ codegen/JNI path is identical across ABIs.
      - run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 --console=plain
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-x86_64
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

  emulator:
    name: Emulator run (real build, screenshots)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      # Debug build with the JS bundled in (runs without Metro) and the debug-only test receiver.
      - run: ./gradlew assembleDebug -PreactNativeArchitectures=x86_64 -PbundleJsInDebug --console=plain
        working-directory: android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/ci/emulator-run.sh
      - name: Step log and contact sheet
        if: always()
        run: |
          cat emulator-output/steps.txt || true
          pip install --quiet pillow && python3 scripts/ci/contact_sheet.py emulator-output contact-sheet.jpg || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-screenshots
          path: |
            emulator-output/
            contact-sheet.jpg
          retention-days: 14

  # Prints thumbnails into the job log (3 jobs, so each log stays small) for reviewers who
  # can read logs but can't download artifacts.
  emulator-screenshots-log:
    name: Emulator screenshots in log (${{ matrix.batch }})
    needs: emulator
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        batch: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulator-screenshots
          path: shots
      - run: pip install --quiet pillow && python3 scripts/ci/print_shots.py shots/emulator-output ${{ matrix.batch }} 3
